name: CodeQL (Analisis SAST)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Todos los lunes a las 06:30 UTC (00:30 hora El Salvador UTC-6)
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analizar codigo JavaScript/TypeScript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Descargar repositorio (fijado por SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inicializar CodeQL (fijado por SHA)
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Ejecutar analisis CodeQL (fijado por SHA)
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
